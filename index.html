<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0E0C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fontes sem bloquear a renderização: o texto aparece na fonte de
         sistema e troca quando a web font chega (display=swap). #peso-3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      />
    </noscript>

    <title>CodeTier — Aprenda programação com trilhas guiadas</title>
    <meta name="description" content="CodeTier é um app de ensino de programação com trilhas guiadas, aulas curtas, projetos e prática de código.">
    <meta name="author" content="CodeTier" />
    <!-- Padrão do site; cada rota pública sobrescreve canonical/og:url ao
         montar (ver src/hooks/useDocumentMeta.ts). #seo -->
    <link rel="canonical" href="https://codetier.vercel.app/" />
    <meta property="og:url" content="https://codetier.vercel.app/" />
    <meta property="og:site_name" content="CodeTier" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://codetier.vercel.app/brand-og.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@codetier" />
    <meta name="twitter:image" content="https://codetier.vercel.app/brand-og.png">
    <meta property="og:title" content="CodeTier — Aprenda programação com trilhas guiadas">
  <meta name="twitter:title" content="CodeTier — Aprenda programação com trilhas guiadas">
  <meta property="og:description" content="App de ensino de programação com trilhas guiadas, aulas curtas, projetos e prática de código.">
  <meta name="twitter:description" content="App de ensino de programação com trilhas guiadas, aulas curtas, projetos e prática de código.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
